#####################################################################
#print_start
#####################################################################

[gcode_macro PRINT_START]
gcode:
  {% set TOOL = params.TOOL | default(0)| int %}
  {% set TOOL_TEMP = params.TOOL_TEMP | default(0) | int %}
  {% set BED_TEMP = params.BED_TEMP | default(0) | int %}

  {% if printer.tool_probe_endstop is defined %}
    M117 Disabling crash detection
    STOP_CRASH_DETECTION
  {% endif %}
  
  SET_DISPLAY_TEXT MSG="Hotend: {BED_TEMP}c"
  M117 Heating Bed
  M190 S{BED_TEMP}
  M109 S110

  M117 Homing
  G28

  SET_DISPLAY_TEXT MSG="Select T0 For QGL"
  T0 ; Ensure we have T0 active for pre print calibrations.

  # Conditionnal QGL.
  SET_DISPLAY_TEXT MSG="QGL"                       # Display info on display
  {% if printer["gcode_macro _KEEP_FLAGS"].keep_active == 0 %}
    SET_DISPLAY_TEXT MSG="Keep off RunQGL"
    QUAD_GANTRY_LEVEL                                # Level the printer via QGL
  {% else %}
      RESPOND PREFIX="KEEP" MSG="CQGL?"
      {% if printer.quad_gantry_level.applied == False %}
        RESPOND PREFIX="KEEP" MSG="RunQGL"
        QUAD_GANTRY_LEVEL
      {% endif %}
      RESPOND PREFIX="KEEP" MSG="QGL Ready"
    {% endif %}

  G28 Z ; Home Z again after QGL

  SET_GCODE_VARIABLE MACRO=_KEEP_FLAGS VARIABLE=keep_active VALUE=0
  #BED_MESH_PROFILE LOAD=default
  SKEW_PROFILE LOAD=Calilantern
  BED_MESH_CALIBRATE ADAPTIVE=1 ; Run adaptive bed mesh

  # Preheat all the hotends in use
  {% for tool_nr in printer.toolchanger.tool_numbers %}
    {% set tooltemp_param = 'T' ~ tool_nr|string ~ '_TEMP' %}
    {% if tooltemp_param in params %}
      M104 T{tool_nr} S{params[tooltemp_param]}
    {% endif %}
  {% endfor %}

  {% if printer.tool_probe_endstop is defined %}
    M117 Re-enabling crash detection
    START_CRASH_DETECTION
  {% endif %}                                                # Absolute position
  
  SET_FAN_SPEED FAN=T0_partfan SPEED=0.30
  SET_FAN_SPEED FAN=T1_partfan SPEED=0.30

  # Get ready to print by doing a primeline and updating the LEDs
  SET_DISPLAY_TEXT MSG="Starting First Line"              # Display info on display

  PRIME_LINES INITIAL_TOOL={TOOL}

  SET_FAN_SPEED FAN=T0_partfan SPEED=0.00
  SET_FAN_SPEED FAN=T1_partfan SPEED=0.00
  #--------------------------------------------------------------------


#####################################################################
#print_end
#####################################################################

[gcode_macro PRINT_END]
gcode:
  {% set th = printer.toolhead %}
  {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
  {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
  {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

  M220 S100 ; Set Feed rate to 100%
  M221 S100 ; Set Flow rate to 100%
  
  SET_SKEW CLEAR=1
  BED_MESH_CLEAR
  SET_PRESSURE_ADVANCE ADVANCE=0 ; Disable pressure advance

  G92 E0 ; zero the extruder
  G1 E-10.0 F3600 ; retract filament
  M400 ; wait for buffer to clear

  T0 ; Switch to tool 0

  G90 ; absolute positioning
  G0 X{x_safe} Y{y_safe} Z{z_safe} F20000 ; move nozzle to remove stringing
  G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600 ; park nozzle at rear

  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0 ; reset gcode offset

  {% for tn in printer.toolchanger.tool_numbers %}
      M104 S0 T{tn} ; shutdown tool heater
      M107 T{tn} ; shutdown tool fan
      SET_STEPPER_ENABLE STEPPER=extruder{tn if tn > 0 else ''} ENABLE=0 ; disable extruder stepper
  {% endfor %}

  M140 S0 ; shutdown bed heater
  
[gcode_macro PRINT_END]
gcode:
  {% set th = printer.toolhead %}
  {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
  {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
  {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

  M220 S100 ; Set Feed rate to 100%
  M221 S100 ; Set Flow rate to 100%
  
  SET_SKEW CLEAR=1
  BED_MESH_CLEAR
  SET_PRESSURE_ADVANCE ADVANCE=0 ; Disable pressure advance

  G92 E0 ; zero the extruder
  G1 E-4.0 F3600 ; retract filament
  M400 ; wait for buffer to clear

  T0 ; Switch to tool 0

  G90 ; absolute positioning
  G0 X{x_safe} Y{y_safe} Z{z_safe} F20000 ; move nozzle to remove stringing
  G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600 ; park nozzle at rear

  {% for tn in printer.toolchanger.tool_numbers %}
      M104 S0 T{tn} ; shutdown tool heater
      M107 T{tn} ; shutdown tool fan
      SET_STEPPER_ENABLE STEPPER=extruder{tn if tn > 0 else ''} ENABLE=0 ; disable extruder stepper
  {% endfor %}

  {% if printer["gcode_macro _KEEP_FLAGS"].keep_active == 0 %}
    SET_DISPLAY_TEXT MSG="Keep Off End Print"
    M140 S0 ; Shutdown bed heater only if keep flag is disabled
  {% else %}
    {% set target_bed = printer.heater_bed.target %}
    SET_DISPLAY_TEXT MSG="Keep On set temp for after print"
    M140 S{target_bed} ; Maintain current bed target temperature
  {% endif %}
  #--------------------------------------------------------------------